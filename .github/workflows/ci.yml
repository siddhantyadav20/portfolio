# Nothing ran automatically before this. `lint` and `typecheck` were both in
# package.json and both entirely dependent on someone remembering.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # `references/` is ~110MB of source material that used to be tracked
        # here and is imported by nothing. It is untracked now, so the tip
        # commit no longer carries it — but the history still does, and a full
        # clone would still pay for it.
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before the typecheck, and this is why every run of this job failed from
      # the day it was added.
      #
      # `PageProps` and `LayoutProps` are globals Next *generates* from the
      # route files — they are not written by hand and not in node_modules, so
      # `tsc` cannot resolve them until something has produced them. Locally
      # that something is the last `next dev` or `next build`, which is why the
      # typecheck passes on a developer's machine and has never passed here: a
      # fresh checkout has no `.next/types` and this step ran before the build
      # that would have written it.
      #
      # `typegen` writes exactly those definitions and nothing else, so the
      # cheap checks stay cheap rather than being reordered behind a build. It
      # needs no environment: it reads the route files, it does not render
      # them.
      - run: npx next typegen

      - run: npm run typecheck
      - run: npm run lint

      # The pure logic everything that moves is built on: the spring
      # integrator, the timeline's dial, and the search matcher behind the
      # site's boldest numbers. No jsdom and no component tests — see
      # vitest.config.ts for why that is deliberate rather than unfinished.
      - run: npm test

      # The real gate. Type errors and lint are cheap; a build that fails on a
      # missing env var or a bad metadata export is what actually breaks a
      # deploy, and it is the one thing nobody runs locally before pushing.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://siddhantyadav.com

      # Real-user vitals (app/vitals.tsx) report a regression after strangers
      # have paid for it. This is the half that stops one: the homepage's JS
      # and everything in public/, against committed ceilings. Runs after the
      # build because that is where the numbers come from.
      - run: npm run budget
