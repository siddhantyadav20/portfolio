# Nothing ran automatically before this. `lint` and `typecheck` were both in
# package.json and both entirely dependent on someone remembering.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # `references/` is ~110MB of source material tracked in this repo and
        # imported by nothing. The build does not read it and neither does the
        # type checker (see tsconfig's `exclude`), so there is no reason to
        # pull the history that carries it.
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint

      # The real gate. Type errors and lint are cheap; a build that fails on a
      # missing env var or a bad metadata export is what actually breaks a
      # deploy, and it is the one thing nobody runs locally before pushing.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://siddhantyadav.com
